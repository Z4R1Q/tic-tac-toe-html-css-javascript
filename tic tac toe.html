<!-- A tic tac toe game made just for parcticing my html layout , css styling and javascripts logic -->
<!-- HTML = tic tac toe.html -->
<!-- CSS = tic tac toe.css-->
<!-- JavaScript = tic tac toe.js -->

<!-- HTML for Tic Tac Toe Game -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC TAC TOE</title>

<!-- link to the css file -->
    <link href="tic tac toe.css" rel="stylesheet">
</head>
<body>

<!-- Container for the game stuff with id container -->
    <div id="contanier">
<!-- Heading for the game with id heading -->
        <h1 id="heading">Tic Tac Toe</h1>
<!-- Div for the win message and turn message with id win -->
        <div id="win"></div>
<!-- Div for the game button with id board -->
        <div id="board">
<!-- 9 button with identical class cell -->
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>
    </div>

<!-- Script for the game logic -->
    <script src="tic tac toe.js" defer></script>

</body>
</html>
